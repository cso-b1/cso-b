<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تصريح جاهز للتنزيل</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background: #0d141e;
            color: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 16px;
        }
        .container {
            background-color: #121c27;
            border: 1px solid #1a2736;
            border-radius: 20px;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.5);
            padding: 28px 20px;
            width: 100%;
            max-width: 400px;
            text-align: center;
        }
        .logo-container {
            display: flex;
            justify-content: center;
            margin-bottom: 20px;
        }
        .logo-container img {
            width: 110px;
            height: 110px;
            object-fit: contain;
            border-radius: 18px;
            background-color: #ffffff;
            padding: 8px;
        }
        h1 {
            color: #ffffff;
            font-size: 24px;
            font-weight: 700;
            margin-bottom: 12px;
        }
        .description {
            color: #8b9bb4;
            font-size: 13.5px;
            margin-bottom: 24px;
            line-height: 1.6;
            padding: 0 10px;
        }
        .info-list {
            display: flex;
            flex-direction: column;
            gap: 12px;
            margin-bottom: 24px;
        }
        .info-box {
            background-color: #172331;
            border: 1px solid #1f2f42;
            border-radius: 12px;
            padding: 14px 16px;
            text-align: right;
        }
        .info-label {
            color: #718298;
            font-size: 12px;
            margin-bottom: 4px;
            display: block;
        }
        .info-value {
            color: #ffffff;
            font-size: 16px;
            font-weight: 700;
            word-break: break-word;
        }
        .download-btn {
            display: block;
            background: linear-gradient(90deg, #00d2c4 0%, #00a8e8 100%);
            color: #080d14;
            text-decoration: none;
            padding: 16px;
            border-radius: 12px;
            font-size: 16px;
            font-weight: 700;
            transition: opacity 0.2s ease;
            box-shadow: 0 4px 20px rgba(0, 210, 196, 0.25);
            margin-bottom: 14px;
        }
        .download-btn:active {
            opacity: 0.85;
        }
        .footer-text {
            color: #63758d;
            font-size: 12px;
            line-height: 1.4;
        }
    </style>
</head>
<body>

<div class="container">
    <!-- الشعار -->
    <div class="logo-container">
        <img src="logo.png" alt="Logo">
    </div>

    <h1>تصريح جاهز للتنزيل</h1>
    <p class="description">استخدم الزر أدناه لتنزيل نسخة PDF الرسمية للتصريح. يمكنك مشاركتها مع الجهات المعنية للتحقق.</p>

    <!-- قائمة البيانات العمودية للموبايل -->
    <div class="info-list">
        <div class="info-box">
            <span class="info-label">رقم التصريح</span>
            <span class="info-value">11324</span>
        </div>
        <div class="info-box">
            <span class="info-label">الشركة</span>
            <span class="info-value">مرود الخليج</span>
        </div>
        <div class="info-box">
            <span class="info-label">تاريخ الإصدار</span>
            <span class="info-value">2026-06-16</span>
        </div>
        <div class="info-box">
            <span class="info-label">تاريخ الانتهاء</span>
            <span class="info-value">2026-12-30</span>
        </div>
    </div>

    <!-- زر التحميل -->
    <a href="my-permit.pdf" class="download-btn" target="_blank">
        اضغط لتنزيل التصريح (PDF)
    </a>
    
    <div class="footer-text">سيبدأ التنزيل مباشرة. إذا لم يبدأ، اضغط الزر مرة أخرى.</div>
</div>

</body>
</html>
